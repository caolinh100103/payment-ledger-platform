spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:15434/notification}
    username: ${NOTIFICATION_DB_USER:notification}
    password: ${NOTIFICATION_DB_PASSWORD:notification}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      # Forwards to the retry and dead-letter topics get a span of their own, in the same trace.
      observation-enabled: true
    consumer:
      group-id: notification-service
      # A new deployment starts from the oldest retained event rather than missing what happened before it.
      auto-offset-reset: earliest
    listener:
      # Commit each offset right after its record was processed (and its database transaction committed).
      ack-mode: record
      # Continue the trace in the record's traceparent header, written by the core's outbox relay: this service's
      # spans and log lines join the trace of the request that caused the event.
      observation-enabled: true
      concurrency: 3

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # Every trace is kept here; production keeps a fraction or lets a collector choose (tail sampling).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger in infra/docker-compose.yml takes OTLP over HTTP.
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Prometheus scrapes /actuator/prometheus; the OpenTelemetry starter's OTLP metrics push stays off.
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

payledger:
  security:
    jwt:
      # The core service issues the access tokens and publishes its public keys here.
      jwk-set-uri: ${PAYLEDGER_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
      issuer: ${PAYLEDGER_JWT_ISSUER:http://localhost:8080}
      audience: payledger-api
  notification:
    topic: payledger.transfers
  processed-events:
    # Must exceed the topic's retention (7 days by default): an event can be redelivered while Kafka still has it.
    retention: 14d
    cleanup-interval: PT1H
