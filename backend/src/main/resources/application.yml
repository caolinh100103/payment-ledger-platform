spring:
  application:
    name: payledger-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/payledger}
    username: ${DB_USERNAME:payledger}
    password: ${DB_PASSWORD:payledger}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # Wait for all in-sync replicas; with idempotence, broker-side retries cannot duplicate or reorder
      # messages within a partition.
      acks: all
      properties:
        "[enable.idempotence]": true
        # Fail fast when the broker is unreachable: the events stay in the outbox and the relay tries again.
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
        "[linger.ms]": 5
  task:
    scheduling:
      pool:
        # The outbox relay blocks while Kafka is down; housekeeping jobs must not wait behind it.
        size: 2

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    # OutboxRelay reports failed sends itself: one line per batch, without event payloads (personal data).
    org.springframework.kafka.support.LoggingProducerListener: "off"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

payledger:
  kafka:
    topics:
      transfers:
        partitions: 3
        replicas: ${KAFKA_REPLICAS:1}
  outbox:
    relay:
      # Disabled only in tests that drive the relay by hand.
      enabled: true
      poll-interval: PT0.2S
      batch-size: 100
      send-timeout: 15s
    # Published rows are kept this long for debugging and replay, then deleted.
    retention: 7d
    cleanup-interval: PT10M
  ledger:
    # Max wait for an account row lock; beyond it the request fails fast with a retryable 503.
    lock-timeout: 3s
  idempotency:
    # How long a key and its stored response are kept (Stripe keeps keys for 24 hours).
    retention: 24h
    # If the request holding a key dies, another request with the same key may take over after this.
    lease: 30s
    cleanup-interval: PT10M
