# The web app and its API on one origin. Service addresses are the docker compose service names.

# Re-resolve the services through Docker's DNS, so a restarted container's new address is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # A strict Content Security Policy: only this origin's scripts run, so markup injected into the page cannot load
    # or execute code, the second line of defence for the access token held in memory (ADR 0015).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    set $core http://core:8080;
    set $audit http://audit:8082;
    set $notification http://notification:8083;

    proxy_set_header Host $host;
    # The core rate-limits sign-in per client address; it trusts these headers from a private-network proxy
    # (server.forward-headers-strategy=native).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 30s;

    location /api/v1/audit-events {
        proxy_pass $audit;
    }

    location /api/v1/notifications {
        proxy_pass $notification;
    }

    location /api/ {
        proxy_pass $core;
    }

    # Content-hashed file names: cached for good, a new build has new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every other path is a screen of the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
