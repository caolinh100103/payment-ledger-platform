name: Frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend.yml

jobs:
  build:
    name: web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The TypeScript types must be generated from the committed OpenAPI documents, which the backend's contract
      # tests keep equal to the real APIs (ADR 0016). A stale or hand-edited type file fails here.
      - name: API types match the OpenAPI documents
        run: npm run generate:api && git diff --exit-code -- src/api/generated

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the nginx configuration
        run: >
          docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:1.29-alpine nginx -t
