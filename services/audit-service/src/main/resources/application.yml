spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:15433/audit}
    # The runtime role may only SELECT and INSERT audit_events (see V1__audit_events.sql).
    username: ${AUDIT_DB_APP_USER:audit_app}
    password: ${AUDIT_DB_APP_PASSWORD:audit_app}
  flyway:
    # Migrations run as the schema owner, a different role from the one the application uses.
    user: ${AUDIT_DB_OWNER:audit_owner}
    password: ${AUDIT_DB_OWNER_PASSWORD:audit_owner}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      # Forwards to the retry and dead-letter topics get a span of their own, in the same trace.
      observation-enabled: true
    consumer:
      group-id: audit-service
      # A new audit consumer must see the whole history, not only what is published after it starts.
      auto-offset-reset: earliest
    listener:
      # Commit each offset right after its record was processed (and its database transaction committed).
      ack-mode: record
      # Continue the trace in the record's traceparent header, written by the core's outbox relay: this service's
      # spans and log lines join the trace of the request that caused the event.
      observation-enabled: true
      # One consumer thread per partition of payledger.transfers.
      concurrency: 3

logging:
  structured:
    format:
      # JSON lines in Elastic Common Schema (ECS), for a log pipeline (Filebeat, Fluent Bit, Grafana Alloy). Each line
      # carries the trace and span ids. For plain text in a terminal, start the service with LOG_FORMAT= (empty).
      console: ${LOG_FORMAT:ecs}
    json:
      rename:
        # ECS field names for the trace context, so Kibana and Elastic APM link each line to its trace.
        "[traceId]": trace.id
        "[spanId]": span.id

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # Every trace is kept here; production keeps a fraction or lets a collector choose (tail sampling).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger in infra/docker-compose.yml takes OTLP over HTTP.
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Prometheus scrapes /actuator/prometheus; the OpenTelemetry starter's OTLP metrics push stays off.
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

payledger:
  security:
    jwt:
      # The core service issues the access tokens and publishes its public keys here.
      jwk-set-uri: ${PAYLEDGER_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
      issuer: ${PAYLEDGER_JWT_ISSUER:http://localhost:8080}
      audience: payledger-api
  audit:
    # Money movements, account lifecycle, and security events (sign-ins, lockouts, sessions, users, API keys).
    topics: payledger.transfers,payledger.accounts,payledger.security
