name: payledger

# Local development infrastructure.
# Host ports are shifted (15432, 16379, 29092) to avoid clashing with locally installed services.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payledger
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Database per service: the audit trail lives apart from the core database it audits.
  audit-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit_owner
      POSTGRES_PASSWORD: audit_owner
    ports:
      - "${AUDIT_POSTGRES_PORT:-15433}:5432"
    volumes:
      - audit-postgres-data:/var/lib/postgresql/data
      - ./postgres/audit-init.sql:/docker-entrypoint-initdb.d/audit-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_owner -d audit"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "${NOTIFICATION_POSTGRES_PORT:-15434}:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # Consumer lag measured from the broker's committed offsets, not by the consumers themselves: a consumer that is
  # down or stuck reports nothing, which is exactly when its lag matters.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:19092"]
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Keeps the trace ids attached to histogram samples, so a latency spike on a dashboard links to a trace.
      - --enable-feature=exemplar-storage
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Traces from the three services (OTLP over HTTP on 4318), kept in memory; UI on 16686.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

  # ------------------------------------------------------------------------------------------------------------------
  # The application itself, for a demo or a single-host deployment: docker compose --profile app up -d --build
  # Without the profile, only the infrastructure starts and the services run from the IDE or with ./mvnw.
  # Their ports are published on the host as in local development, so Prometheus scrapes them the same way.
  # ------------------------------------------------------------------------------------------------------------------

  core:
    profiles: [app]
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payledger
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PAYLEDGER_JWT_ISSUER: http://core:8080
      # Creates the first ADMIN (15+ characters). Put it in infra/.env, which git ignores, never in the repository.
      PAYLEDGER_ADMIN_PASSWORD: ${PAYLEDGER_ADMIN_PASSWORD:-}
      # A private P-256 JWK; empty means a random key per start (sessions end when the container restarts).
      PAYLEDGER_JWT_SIGNING_KEY: ${PAYLEDGER_JWT_SIGNING_KEY:-}
      # The refresh cookie is Secure (HTTPS, or http://localhost). Set to false only to try the app over plain HTTP
      # on another host.
      PAYLEDGER_SECURE_COOKIE: ${PAYLEDGER_SECURE_COOKIE:-true}
      # Behind nginx: the client address for sign-in rate limits comes from X-Forwarded-For.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # RATE_LIMIT_ENABLED=false only for load tests (loadtest/README.md), which send far more than a person would.
      PAYLEDGER_RATELIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Database connections; each money movement holds one while it waits for its account locks (loadtest/README.md).
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${DB_POOL_SIZE:-10}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl: ask the readiness probe over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  audit:
    profiles: [app]
    build: ../services/audit-service
    environment:
      AUDIT_DB_URL: jdbc:postgresql://audit-postgres:5432/audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PAYLEDGER_JWKS_URI: http://core:8080/.well-known/jwks.json
      PAYLEDGER_JWT_ISSUER: http://core:8080
    ports:
      - "${AUDIT_PORT:-8082}:8082"
    depends_on:
      audit-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    profiles: [app]
    build: ../services/notification-service
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-postgres:5432/notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      PAYLEDGER_JWKS_URI: http://core:8080/.well-known/jwks.json
      PAYLEDGER_JWT_ISSUER: http://core:8080
    ports:
      - "${NOTIFICATION_PORT:-8083}:8083"
    depends_on:
      notification-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # The web app and the reverse proxy in front of the three services (frontend/nginx.conf).
  web:
    profiles: [app]
    build:
      context: ../frontend
      args:
        VITE_DEMO_CREDENTIALS: ${VITE_DEMO_CREDENTIALS:-}
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      core:
        condition: service_healthy
      audit:
        condition: service_started
      notification:
        condition: service_started

volumes:
  postgres-data:
  audit-postgres-data:
  notification-postgres-data:
  grafana-data:
