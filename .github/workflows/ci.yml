name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One failing service should not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          - name: backend
            path: backend
          - name: audit-service
            path: services/audit-service
          - name: notification-service
            path: services/notification-service
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      # Integration tests start PostgreSQL and Kafka via Testcontainers using the runner's Docker daemon.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.name }}
          path: ${{ matrix.path }}/target/surefire-reports
