spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:15433/audit}
    # The runtime role may only SELECT and INSERT audit_events (see V1__audit_events.sql).
    username: ${AUDIT_DB_APP_USER:audit_app}
    password: ${AUDIT_DB_APP_PASSWORD:audit_app}
  flyway:
    # Migrations run as the schema owner, a different role from the one the application uses.
    user: ${AUDIT_DB_OWNER:audit_owner}
    password: ${AUDIT_DB_OWNER_PASSWORD:audit_owner}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: audit-service
      # A new audit consumer must see the whole history, not only what is published after it starts.
      auto-offset-reset: earliest
    listener:
      # Commit each offset right after its record was processed (and its database transaction committed).
      ack-mode: record
      # One consumer thread per partition of payledger.transfers.
      concurrency: 3

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

payledger:
  security:
    jwt:
      # The core service issues the access tokens and publishes its public keys here.
      jwk-set-uri: ${PAYLEDGER_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
      issuer: ${PAYLEDGER_JWT_ISSUER:http://localhost:8080}
      audience: payledger-api
  audit:
    topic: payledger.transfers
