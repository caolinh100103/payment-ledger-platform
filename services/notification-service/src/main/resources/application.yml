spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:15434/notification}
    username: ${NOTIFICATION_DB_USER:notification}
    password: ${NOTIFICATION_DB_PASSWORD:notification}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      # A new deployment starts from the oldest retained event rather than missing what happened before it.
      auto-offset-reset: earliest
    listener:
      # Commit each offset right after its record was processed (and its database transaction committed).
      ack-mode: record
      concurrency: 3

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

payledger:
  security:
    jwt:
      # The core service issues the access tokens and publishes its public keys here.
      jwk-set-uri: ${PAYLEDGER_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
      issuer: ${PAYLEDGER_JWT_ISSUER:http://localhost:8080}
      audience: payledger-api
  notification:
    topic: payledger.transfers
  processed-events:
    # Must exceed the topic's retention (7 days by default): an event can be redelivered while Kafka still has it.
    retention: 14d
    cleanup-interval: PT1H
