apiVersion: 1

providers:
  # Dashboards are files in the repo (infra/grafana/dashboards): reviewed in pull requests like code, and edits
  # made in the UI are not kept.
  - name: payledger
    folder: PayLedger
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
