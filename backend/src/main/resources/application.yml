spring:
  application:
    name: payledger-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/payledger}
    username: ${DB_USERNAME:payledger}
    password: ${DB_PASSWORD:payledger}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # Wait for all in-sync replicas; with idempotence, broker-side retries cannot duplicate or reorder
      # messages within a partition.
      acks: all
      properties:
        "[enable.idempotence]": true
        # Fail fast when the broker is unreachable: the events stay in the outbox and the relay tries again.
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
        "[linger.ms]": 5
  task:
    scheduling:
      pool:
        # The outbox relay blocks while Kafka is down; housekeeping jobs must not wait behind it.
        size: 2

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    # OutboxRelay reports failed sends itself: one line per batch, without event payloads (personal data).
    org.springframework.kafka.support.LoggingProducerListener: "off"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # Redis only backs the rate limiter, which fails open: it being down must not mark the service unhealthy.
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

payledger:
  security:
    jwt:
      # Must match on every service that verifies the tokens.
      issuer: ${PAYLEDGER_JWT_ISSUER:http://localhost:8080}
      audience: payledger-api
      # RFC 9068 client_id claim: the application the user signed in with.
      client-id: payledger-app
      # Short, because an access token cannot be revoked; the refresh token gets the next one.
      access-token-ttl: 5m
      # Private EC P-256 JWK (JSON with a kid), from a secret store. Empty: a random key per start (dev only).
      signing-key: ${PAYLEDGER_JWT_SIGNING_KEY:}
    refresh:
      # Idle timeout, within OWASP's 15-30 minutes for a high-value application: each refresh token lasts this
      # long, and using it issues the next one.
      token-ttl: 15m
      # Absolute lifetime of a sign-in session (a working day), however active the user is.
      session-ttl: 8h
      cleanup-interval: PT1H
    login:
      # As VCB Digibank: the 5th wrong password in a row locks the user out.
      max-failed-attempts: 5
      lockout-duration: 15m
    bootstrap-admin:
      # Created at startup only if no ADMIN exists and a password is set (at least 15 characters).
      username: ${PAYLEDGER_ADMIN_USERNAME:admin}
      password: ${PAYLEDGER_ADMIN_PASSWORD:}
  rate-limit:
    enabled: true
    # Stripe's rule: a broken limiter must not break the API. A Redis command slower than this lets the request in,
    # and Redis is then left alone for the cooldown.
    redis-timeout: 200ms
    fail-open-cooldown: 5s
    policies:
      # Token buckets: up to capacity requests at once, refilled at capacity per period.
      user:
        capacity: 120
        period: 1m
      api-key:
        # A bank sends webhooks in bursts, e.g. after a settlement batch.
        capacity: 600
        period: 1m
      anonymous:
        # Per IP: sign-in, sign-up and refresh. Slows credential stuffing; lockout stops guessing one password.
        capacity: 20
        period: 1m
  kafka:
    # For payledger.transfers, payledger.accounts and payledger.security.
    topics:
      partitions: 3
      replicas: ${KAFKA_REPLICAS:1}
  outbox:
    relay:
      # Disabled only in tests that drive the relay by hand.
      enabled: true
      poll-interval: PT0.2S
      batch-size: 100
      send-timeout: 15s
    # Published rows are kept this long for debugging and replay, then deleted.
    retention: 7d
    cleanup-interval: PT10M
  ledger:
    # Max wait for an account row lock; beyond it the request fails fast with a retryable 503.
    lock-timeout: 3s
  idempotency:
    # How long a key and its stored response are kept (Stripe keeps keys for 24 hours).
    retention: 24h
    # If the request holding a key dies, another request with the same key may take over after this.
    lease: 30s
    cleanup-interval: PT10M
